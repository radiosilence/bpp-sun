[tools]
uv = "latest"
actionlint = "1.7.12"
shellcheck = "0.11.0"

[tasks.data]
description = "Rebuild site/data from EA LIDAR and OSM (delete pipeline/raw to refetch)"
run = "uv run pipeline/build.py"

[tasks.serve]
description = "Serve the site on :8765"
run = "python3 -m http.server 8765 -d site"

[tasks.actionlint]
description = "Lint GitHub Actions workflows"
run = "actionlint"
